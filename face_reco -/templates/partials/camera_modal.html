<!-- CAMERA MODAL -->
<div id="cameraModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">

    <div class="bg-white rounded-xl shadow-xl p-6 w-[450px] relative">

        <!-- Close Button -->
        <button onclick="closeCameraModal()"
            class="absolute top-3 right-3 text-gray-500 hover:text-gray-700">
            ✕
        </button>

        <h2 class="text-xl font-bold mb-4 text-gray-800">Face Recognition</h2>

        <!-- Video Stream -->
        <div class="w-full h-[300px] bg-black rounded overflow-hidden flex items-center justify-center mb-4">
            <video id="videoFeed" autoplay playsinline class="w-full"></video>
        </div>

        <!-- Capture Button -->
        <button onclick="captureAndRecognize()"
            class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow text-lg font-semibold">
            Capture & Recognize
        </button>

    </div>

</div>
