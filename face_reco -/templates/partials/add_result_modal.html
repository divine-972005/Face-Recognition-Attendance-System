<div id="resultModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
<div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 relative">


<button onclick="closeResultModal()" class="absolute right-4 top-4 text-gray-500 hover:text-black text-xl">×</button>


<h3 class="text-xl font-semibold mb-4">Add Student Result</h3>


<form action="/results/add" method="POST" class="space-y-4">


<div>
<label class="text-sm font-medium">Student ID</label>
<input type="text" name="student_id" required class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200" />
</div>


<div>
<label class="text-sm font-medium">Subject</label>
<input type="text" name="subject" placeholder="e.g., Data Structures" required class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200" />
</div>


<div>
<label class="text-sm font-medium">Marks</label>
<input type="number" name="marks" min="0" max="100" required class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200" />
</div>


<div>
<label class="text-sm font-medium">Grade</label>
<select name="grade" class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200">
<option>A+</option>
<option>A</option>
<option>B+</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>F</option>
</select>
</div>


<div>
<label class="text-sm font-medium">Date</label>
<input type="date" name="date" required class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200" />
</div>


<div class="flex justify-end space-x-3 pt-4">
<button type="button" onclick="closeResultModal()" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">Cancel</button>
<button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Save</button>
</div>
</form>


</div>
</div>
